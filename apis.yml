name: Karius
description: >-
  Karius is an infectious disease diagnostics company that applies clinical
  metagenomics and machine learning to microbial cell-free DNA (mcfDNA) circulating
  in the bloodstream, detecting pathogens that conventional culture-based testing
  misses. Its CLIA-certified and CAP-accredited laboratory runs the Karius Spectrum
  blood test, which screens a single blood draw for more than 1,000 bacteria, fungi,
  DNA viruses, and parasites, and the Karius Focus BAL test, which detects more than
  500 pathogens in bronchoalveolar lavage fluid for lung infections. Results are
  returned to clinicians managing complex, immunocompromised, and
  difficult-to-diagnose patients.
